# Configuration for errata.
#
# Override the path to this file with ERRATA_CONFIG.
# Unknown top-level keys are rejected, so a typo fails loudly instead of
# silently falling back to a default.

# Where course content lives, relative to this file.
# Override at runtime with ERRATA_ROOT, e.g. to point at Syncjar output.
contentRoot: _local-mirror/courses/courses

# Findings that are known, understood, and deliberately not fixed yet.
#
# Resolved relative to contentRoot, not to this file, because the list describes
# the content and should travel with it -- pointing ERRATA_ROOT at a different
# checkout picks up that checkout's own record.
#
# A dotfile at the content repository root is deliberate: it sits outside both
# directions of sync, so Syncjar never pushes it to Skilljar and the GCS export,
# which walks `[A-Z]*`, does not sweep it up either.
knownIssuesFile: ../.errata.yaml

# Domain whose published slugs are used to build public lesson URLs.
primaryDomain: courses.chainguard.dev

# Registry host prefixes whose image references are worth resolving.
registryPrefixes:
  - cgr.dev/

# Age at which a digest pinned in the content stops being merely behind its
# tag and starts being misleading.
#
# These images rebuild continuously, so nearly every pin is behind within days;
# that alone says nothing. A year is roughly where the surrounding prose --
# package versions, CVE counts, sample output -- stops matching what a reader
# would actually see.
staleImageDays: 365

# `data-lang` value -> how the block should be treated by tests.
#
# `kind` is the axis tests dispatch on, and it deliberately does not match
# `data-lang` one-to-one: `console` and `ansi` are both terminal text, but only
# one of them is something a reader is meant to run.
#
#   shell   executable commands
#   output  transcripts and sample output; never executable
#   config  declarative files that should parse with a real parser
#   source  program source in some other language
#
# `parser` selects the checker in src/parse-config.js.
languages:
  console: { kind: shell }
  bash: { kind: shell }
  ansi: { kind: output }
  text: { kind: output }
  json: { kind: config, parser: json }
  yaml: { kind: config, parser: yaml }
  dockerfile: { kind: config, parser: dockerfile }
  docker: { kind: config, parser: dockerfile }
  terraform: { kind: config, parser: hcl }
  go: { kind: source }
  python: { kind: source }
  markdown: { kind: source }
  markup: { kind: source }
  http: { kind: source }

# Courses permitted to reference container images that require authentication.
#
# Most courses should only use images a reader can pull anonymously; a private
# image in an unlisted course usually means a sample was copied from internal
# material. Courses that legitimately teach against private or customer-scoped
# images are listed here, and any course not listed fails the network tier.
privateImages:
  allowedCourses:
    # Builds and pulls yq from the package repository while teaching packaging.
    - Build-Your-First-Chainguard-Container
    # Demonstrates chainguard-base and a customer-scoped node image.
    - Chainguard-Containers-Crash-Course
    # Teaches against the chainguard-private Python images.
    - Chainguard-Libraries-for-Python
    # Uses chainguard.edu mongodb and python images throughout the hands-on lessons.
    - Getting-Started-With-Chainguard-Containers
    # Migration examples built on chainguard-base.
    - Migration-Guidance
    # Registry lessons pull a chainguard.edu mongodb tag.
    - Registry-Rockstar

# Structural problems in the source HTML worth reporting on.
#
# There is no count here: any instance is a finding. One that is understood and
# not yet fixed belongs in the known-issues file, where it is named and dated.
anomalies:
  # A <pre> with no data-lang attribute.
  - missing-lang
  # A <pre> with no <code> child.
  - missing-code-element
  # Unescaped markup inside a block, which the reader's browser parses as real
  # markup and drops.
  - unescaped-markup

# Checking of the links in lesson prose.
links:
  # Domains treated as ours, matched on the registrable domain so every
  # subdomain is included: edu.chainguard.dev, images.chainguard.dev and the
  # rest all qualify.
  #
  # This is not the same idea as primaryDomain, which names the one site whose
  # slugs build public lesson URLs. This list answers a different question:
  # whose redirects do we trust enough to rewrite content against. A 301 from a
  # site we run is a considered decision by someone reachable; a 301 from a
  # third party is a stranger's URL shortener, an A/B test, or a consent wall.
  ownedDomains:
    - chainguard.dev

  # Links no check can reach, with the reason it cannot.
  #
  # Every entry needs a `why`. An unexplained skip is indistinguishable from a
  # broken link somebody gave up on, and this is the file where that mistake
  # would be permanent -- unlike the known-issues file, nothing here expires.
  skip:
    - pattern: 'github\.com/chainguard-dev/internal'
      why: Private repository; anonymous requests get a 404 that means no access.
    - pattern: 'github\.com/chainguard-dev/extra-packages'
      why: Private repository, as above.
    - pattern: 'github\.com/chainguard-dev/package-version-metadata'
      why: Private repository, as above.
    - pattern: '^https?://(www\.)?(twitter|x)\.com/'
      why: Serves a login wall to anything without a browser session.
    - pattern: '^https?://0\.0\.0\.0'
      why: Loopback address in a worked example; only resolvable on the reader's machine.
    - pattern: '^https?://localhost'
      why: As above.

# Ceilings for measurements that move without anyone touching the content.
#
# These are the one case a known-issues entry cannot express. An entry pins the
# content it was accepted against and expires when that content changes, which
# is exactly right for a discrete bug and useless for a digest that ages a day
# every day while the block itself never changes.
driftBudget:
  # Digest-pinned references older than staleImageDays. Every pin in the
  # content currently exceeds it, the youngest by 500 days and the oldest by
  # more than three years, so the age ranking in the report matters more than
  # the count. Sometimes deliberate: a few lessons pin an old image to
  # demonstrate a diff against a newer one.
  staleImageRefs: 21
